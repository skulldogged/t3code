name: Personal release

on:
  push:
    tags:
      - "personal-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact release version"
        required: true
        type: string

permissions:
  contents: read

env:
  T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
  T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
  T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
  T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
  T3CODE_DESKTOP_UPDATE_REPOSITORY: skulldogged/t3code

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#personal-v}"
          else
            version="${DISPATCH_VERSION#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Stamp version
        run: node scripts/update-release-package-versions.ts "${{ needs.metadata.outputs.version }}"
      - name: Check personal mobile and update behavior
        run: |
          vp test run apps/server/src/cloud/pinnedRuntime.test.ts
          vp test run apps/mobile/src/features/background-connection apps/mobile/src/features/agent-awareness/ongoingNotification.test.ts apps/mobile/src/lib/mobileTheme.test.ts
      - name: Typecheck changed packages
        run: vp run --filter t3 --filter @t3tools/mobile typecheck

  wsl_node_pty:
    needs: [metadata, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
      - name: Build Linux node-pty for WSL
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
      - uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  desktop:
    needs: [metadata, validate, wsl_node_pty]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            target: AppImage
            arch: x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - platform: win
            target: nsis
            arch: x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libsecret-1-dev pkg-config
      - name: Download WSL node-pty
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v8
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild
      - name: Stamp version
        run: node scripts/update-release-package-versions.ts "${{ needs.metadata.outputs.version }}"
      - name: Build desktop package
        shell: bash
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.metadata.outputs.version }}"
            --verbose
          )
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            args+=(--wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node")
          fi
          vp run dist:desktop:artifact "${args[@]}"
      - name: Collect desktop artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          find release -maxdepth 1 -type f \( \
            -name '*.AppImage' -o -name '*.exe' -o -name '*.blockmap' -o -name '*.yml' \
          \) -exec cp {} release-publish/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  server_android:
    needs: [metadata, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android compiler cache
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ccache
      - name: Restore Android compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: android-ccache-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            android-ccache-v1-${{ runner.os }}-
      - name: Configure Android compiler cache
        shell: bash
        run: |
          set -euo pipefail
          command -v ccache
          ccache --max-size=2G
          ccache --zero-stats
      - name: Stamp release versions
        run: node scripts/update-release-package-versions.ts "${{ needs.metadata.outputs.version }}"
      - name: Build web and server
        run: |
          vp run --filter @t3tools/web build
          vp run --filter t3 build
      - name: Pack server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          node scripts/pack-server-artifact.ts "${{ needs.metadata.outputs.version }}" release-publish
      - name: Build preview APK
        shell: bash
        env:
          APP_VARIANT: preview
          EXPO_NO_GIT_STATUS: "1"
        run: |
          set -euo pipefail
          export T3CODE_MOBILE_VERSION="${{ needs.metadata.outputs.version }}"
          export T3CODE_ANDROID_VERSION_CODE="$GITHUB_RUN_NUMBER"
          vp exec --filter @t3tools/mobile -- expo prebuild --clean --platform android
          ( cd apps/mobile/android && \
            ./gradlew --build-cache --parallel \
              -PreactNativeArchitectures=arm64-v8a \
              assembleRelease )
          ccache --show-stats
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "release-publish/T3-Code-${{ needs.metadata.outputs.version }}-preview.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: server-android
          path: release-publish/*
          if-no-files-found: error

  release:
    needs: [metadata, desktop, server_android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: server-android
          path: release-assets
      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          ( cd release-assets && sha256sum * > SHA256SUMS )
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: personal-v${{ needs.metadata.outputs.version }}
          name: T3 Code Personal ${{ needs.metadata.outputs.version }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: release-assets/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}
